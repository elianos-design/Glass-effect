[package]
name = "glass_lens_lab"
version = "0.1.0"
edition = "2021"

[lib]
name = "glass_lens"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "glass_lens_lab"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2
